<style>
.main-title, h1.main-title {
  color:#c40c3b !important;
  color:rgb(196,12,59) !important;
  text-align:right !important;
  padding-right:25px !important;
}
.main-title .line1, .main-title .line2 { display:block; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const titles = document.querySelectorAll('.main-title, h1');
  titles.forEach(t=>{
    if(t.textContent.includes('صحة البيئة')){
      t.innerHTML = '<span style="display:block;">صحة البيئة في المنصورة تتلف 24 طنًا</span><span style="display:block; margin-top:8px;">من الأجبان الفاسدة</span>';
      t.style.color = '#c40c3b';
      t.style.textAlign = 'right';
      t.style.paddingRight = '25px';
    }
  });
});
</script>

<style id="final-main-title-fix">
  #root h1.main-title {
    color: #b30f3b !important;
    font-family: Tahoma, Arial, sans-serif !important;
    font-size: clamp(29px, 5.35vw, 40px) !important;
    font-weight: 700 !important;
    line-height: 1.55 !important;
    text-align: right !important;
    letter-spacing: 0 !important;
    padding: 0 26px 0 18px !important;
    margin: 0 !important;
    white-space: normal !important;
    overflow-wrap: normal !important;
  }
  #root .main-title { text-align: right !important; }
  @media (max-width: 420px) {
    #root h1.main-title { font-size: 29px !important; line-height: 1.55 !important; padding-right: 22px !important; padding-left: 12px !important; }
  }
  @media (min-width: 768px) {
    #root h1.main-title { font-size: 34px !important; line-height: 1.55 !important; padding-right: 30px !important; }
  }
</style>

<style id="exact-headline-layout">
.main-title, h1.main-title, #root h1 {
  color: #c40c3b !important;
  text-align: right !important;
  direction: rtl !important;
  font-size: clamp(27px, 4.5vw, 42px) !important;
  font-weight: 700 !important;
  line-height: 1.65 !important;
  padding-right: 25px !important;
  padding-left: 18px !important;
  white-space: normal !important;
  overflow-wrap: normal !important;
}
.main-title span, h1.main-title span { display: block !important; }
@media (max-width: 480px) {
  .main-title, h1.main-title, #root h1 { font-size: 29px !important; line-height: 1.8 !important; padding-right: 22px !important; padding-left: 14px !important; }
}
</style>


<style id="mobile-headline-final-fix">
  #root h1.main-title, #root .main-title {
    width: 100% !important;
    box-sizing: border-box !important;
    direction: rtl !important;
    text-align: right !important;
    padding: 0 8px !important;
    margin: 0 !important;
  }
  #root h1.main-title span, #root .main-title span {
    display: block !important;
    white-space: nowrap !important;
    max-width: 100% !important;
  }
  @media (max-width: 480px) {
    #root h1.main-title, #root .main-title {
      font-size: 22px !important;
      line-height: 1.8 !important;
      padding-right: 8px !important;
      padding-left: 8px !important;
    }
  }
  @media (min-width: 481px) {
    #root h1.main-title, #root .main-title {
      font-size: clamp(27px, 4.5vw, 42px) !important;
    }
  }
</style>

      var stamp = document.getElementById('4may-live-news-status');
      if (!stamp) { stamp = document.createElement('div'); stamp.id = '4may-live-news-status'; stamp.style.cssText = 'font-size:12px;color:#666;background:#fff;text-align:right;padding:6px 12px;direction:rtl'; heading.parentElement.insertAdjacentElement('afterend', stamp); }
      stamp.textContent = 'آخر تحديث: ' + new Date().toLocaleString('ar-YE') + ' — المصدر: صحيفة 4 مايو';
    }
  }
  async function refresh() {
    try {
      var response = await fetch(API_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      var data = await response.json();
      if (!data.items || !data.items.length) throw new Error('لم تصل أخبار من المصدر');
      renderItems(data.items);
    } catch (error) {
      var heading = Array.from(document.querySelectorAll('#root h2')).find(function (h) { return /اهم الاخبار/.test(h.textContent || ''); });
      if (heading && !document.getElementById('4may-live-news-status')) {
        var stamp = document.createElement('div'); stamp.id = '4may-live-news-status';
        stamp.style.cssText = 'font-size:12px;color:#8a4b08;background:#fff;text-align:right;padding:6px 12px;direction:rtl';
        stamp.textContent = 'تعذر التحديث مؤقتًا؛ ستظهر العناوين المحفوظة وستتم إعادة المحاولة تلقائيًا.';
        heading.parentElement.insertAdjacentElement('afterend', stamp);
      }
      console.warn('4May news API refresh failed:', error);
    }
  }
  function start() { refresh(); window.setInterval(refresh, REFRESH_MS); document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

</body>
